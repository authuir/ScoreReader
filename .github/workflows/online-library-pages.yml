name: Deploy online library to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'online-library/public/**'
      - 'online-library/build_site.py'
      - '.github/workflows/online-library-pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as
# we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build static site (regenerate library.json + index.html)
        run: |
          python online-library/build_site.py \
            --site-dir online-library/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: online-library/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
