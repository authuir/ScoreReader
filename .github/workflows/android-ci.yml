name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'online-library/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/online-library-pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'online-library/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The Verovio JNI engine is built from the vendored zip; CMake is
      # invoked by AGP's externalNativeBuild step.
      - name: Install pinned NDK + CMake
        run: |
          set -eu
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # CMake/ninja per-ABI state — first build does ~285 .cpp files for two
      # ABIs which is the slow part. Re-using this cache cuts CI time
      # dramatically on subsequent runs.
      - name: Cache native build (.cxx)
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('app/src/main/cpp/**', 'vendor/verovio-6.1.0.zip', 'app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Extract vendored Verovio source
        run: |
          set -eu
          if [ ! -d vendor/verovio-version-6.1.0 ]; then
            unzip -q -o vendor/verovio-6.1.0.zip -d vendor
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoreReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
