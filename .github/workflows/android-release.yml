name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name for the release (e.g. v1.2.3)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK + CMake
        run: |
          set -eu
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache native build (.cxx)
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('app/src/main/cpp/**', 'vendor/verovio-6.1.0.zip', 'app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Extract vendored Verovio source
        run: |
          set -eu
          if [ ! -d vendor/verovio-version-6.1.0 ]; then
            unzip -q -o vendor/verovio-6.1.0.zip -d vendor
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build both flavors. Release is signed with the debug key so the APK
      # is installable on devices without exposing real signing material.
      - name: Build APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Stage release artifacts
        id: stage
        run: |
          set -eu
          mkdir -p release-out
          TAG="${{ steps.tag.outputs.name }}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-out/ScoreReader-${TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "release-out/ScoreReader-${TAG}-release.apk"
          ls -lh release-out
          {
            echo "## ScoreReader ${TAG}"
            echo
            echo "Two APKs are attached:"
            echo
            echo "- **\`ScoreReader-${TAG}-release.apk\`** — release build,"
            echo "  signed with the project's debug key so it can be"
            echo "  side-loaded on Android 6+ TV/STB devices."
            echo "- **\`ScoreReader-${TAG}-debug.apk\`** — debug build with"
            echo "  full logging, useful for triaging issues."
            echo
            echo "Built from \`${{ github.sha }}\` on GitHub-hosted runners."
          } > release-out/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release-out/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-out/ScoreReader-${{ steps.tag.outputs.name }}-debug.apk
            release-out/ScoreReader-${{ steps.tag.outputs.name }}-release.apk
